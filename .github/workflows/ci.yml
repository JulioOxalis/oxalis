name: CI

on:
  push:
  pull_request:

jobs:
  package:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['12.0', '13.0']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Verify dependency resolution
        run: composer update --dry-run --with laravel/framework:^${{ matrix.laravel }} --with-all-dependencies --no-security-blocking --no-audit

      - name: Lint PHP files
        run: find config database src -name '*.php' -print0 | xargs -0 -n1 php -l
